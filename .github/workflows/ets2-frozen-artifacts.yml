name: ETS2 frozen benchmark suite

on:
  push:
    branches:
      - agent/ets2-workflow-benchmark
    paths:
      - tools/benchmark_frozen_compact.py
      - tools/benchmark_selective_policy_v2.py
      - uk_ets/scripts/build_selective_residual_helpful_case_dataset_v2.py
      - tests/test_benchmark_frozen_compact.py
      - tests/test_selective_policy_v2.py
      - tests/test_selective_dataset_v2.py
      - .github/workflows/ets2-frozen-artifacts.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/benchmark_frozen_compact.py
      - tools/benchmark_selective_policy_v2.py
      - uk_ets/scripts/build_selective_residual_helpful_case_dataset_v2.py
      - tests/test_benchmark_frozen_compact.py
      - tests/test_selective_policy_v2.py
      - tests/test_selective_dataset_v2.py
      - .github/workflows/ets2-frozen-artifacts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ets2-frozen-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out benchmark source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.24,<3" \
            "pandas>=2,<3" \
            "pyarrow>=14,<22" \
            "scikit-learn>=1.3,<2" \
            "pyyaml>=6,<7" \
            "tabulate>=0.9,<1" \
            "pytest>=8,<9"

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_benchmark_frozen_compact.py \
            tests/test_selective_policy_v2.py \
            tests/test_selective_dataset_v2.py

      - name: Run validation-selected frozen compact benchmark
        run: python tools/benchmark_frozen_compact.py

      - name: Build causally aligned selective-policy dataset
        run: python uk_ets/scripts/build_selective_residual_helpful_case_dataset_v2.py

      - name: Run causal selective-policy benchmark
        run: python tools/benchmark_selective_policy_v2.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: ets2-frozen-benchmark-suite
          path: |
            reports/agent_compact_benchmark
            reports/agent_selective_dataset_v2
            reports/agent_selective_policy_v2
          if-no-files-found: error
          retention-days: 30

      - name: Commit benchmark results to the branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/agent_compact_benchmark \
            reports/agent_selective_dataset_v2 \
            reports/agent_selective_policy_v2
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
          else
            git commit -m "Record frozen benchmark suite results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
