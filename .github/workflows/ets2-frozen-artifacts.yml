name: ETS2 frozen compact benchmark

on:
  push:
    branches:
      - agent/ets2-workflow-benchmark
    paths:
      - tools/benchmark_frozen_compact.py
      - .github/workflows/ets2-frozen-artifacts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ets2-frozen-compact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compact benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.24,<3" \
            "pandas>=2,<3" \
            "pyarrow>=14,<22" \
            "scikit-learn>=1.3,<2" \
            "pyyaml>=6,<7" \
            "tabulate>=0.9,<1"

      - name: Run validation-selected frozen benchmark
        run: python tools/benchmark_frozen_compact.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: ets2-frozen-compact-results
          path: reports/agent_compact_benchmark
          if-no-files-found: error
          retention-days: 30

      - name: Commit benchmark results to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agent_compact_benchmark
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
          else
            git commit -m "Record frozen compact benchmark results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
