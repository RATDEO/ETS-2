# Tuned EU ETS Forecasting Configuration
# =======================================
# Optimized for small dataset with regime changes

project:
  name: "EU_ETS_Forecasting"
  version: "0.1.1"

# Target Configuration
target:
  instrument: "ICAP_SECONDARY"
  column: "close_eur"
  source: "icap"
  mode: "returns"

# Time Series Configuration - Shortened sequences
time_series:
  freq: "D"
  horizons: [1, 5, 20, 30]
  pred_len: 30
  seq_len: 60       # Reduced from 120 for less overfitting
  label_len: 15     # Reduced from 30

# Data Split Configuration
split:
  train_end: "2022-12-31"
  val_end: "2023-12-31"
  test_end: "2025-11-27"

# Missing Data Handling
missing:
  max_ffill_days: 5
  min_coverage_pct: 0.80

# Feature Engineering
features:
  include_brent: true
  include_coal: true
  include_indices: true
  indices_list: ["KEUA", "KRBN", "GRN"]  # Reduced from 5 to 3
  include_auctions: true
  auction_features: ["price", "volume", "is_auction_day"]
  auction_lags: [1, 5]  # Reduced lags
  include_vstoxx: true
  returns: true
  rolling_vol_window: 20
  rolling_mean_windows: [5, 20]  # Removed 60-day window

# Model Configuration - DRAMATICALLY REDUCED
model:
  tsm_type: "dlinear"
  
  # Reduced training
  batch_size: 16          # Smaller batches for regularization effect
  learning_rate: 0.001    # Higher LR with smaller model
  max_epochs: 50          # Reduced epochs
  early_stopping_patience: 15
  
  # DRASTICALLY REDUCED ARCHITECTURE
  d_model: 64             # Was 512 (8x reduction)
  n_heads: 2              # Was 8 (4x reduction)
  e_layers: 1             # Was 2
  d_layers: 1
  d_ff: 128               # Was 2048 (16x reduction)
  dropout: 0.3            # Was 0.05 (6x increase)
  
  # Weight decay for L2 regularization
  weight_decay: 0.01
  
  # Gradient clipping
  grad_clip: 0.5
  
  # Feature handling
  enc_in: 8               # Fewer features
  dec_in: 8
  c_out: 1

# LLM Configuration
llm:
  provider: "openai"
  model: "gpt-5.2"
  temperature: 0.5
  max_tokens: 1000
  methods: ["TSM+LLM"]
  history_points: 60      # Match seq_len
  include_summary_stats: true
  max_retries: 3
  cache_enabled: true
  max_samples: 100

# Evaluation Configuration
evaluation:
  primary_metric: "mse"
  additional_metrics: ["mae", "rmse", "mape"]
  trend_threshold_method: "volatility"
  trend_threshold_multiplier: 0.25
  trend_classes: ["down", "flat", "up"]
  significance_level: 0.05
  tests: ["t_test", "wilcoxon"]

# Robustness Configuration
robustness:
  noise_levels: [0.05, 0.10, 0.20, 0.30]
  subperiods:
    - name: "2017-2019"
      start: "2017-01-01"
      end: "2019-12-31"
    - name: "2020-2021"
      start: "2020-01-01"
      end: "2021-12-31"
    - name: "2022-2025"
      start: "2022-01-01"
      end: "2025-11-27"

# Output Configuration
output:
  runs_dir: "runs"
  paper_dir: "paper"
  save_predictions: true
  save_model_checkpoints: true
  generate_plots: true
  generate_paper: true

# Reproducibility
reproducibility:
  seed: 42
  deterministic: true
  log_git_hash: true
  save_config: true

# Computation
compute:
  device: "auto"
  num_workers: 4
  pin_memory: true
