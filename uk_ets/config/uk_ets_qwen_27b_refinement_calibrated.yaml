# UK ETS local-Qwen frozen refinement policy
#
# The primary output is the bounded Qwen HDELTA path admitted only when the
# quantitative ridge base has a non-negative H1-to-H30 slope. The gate was
# selected on two development subsets, then frozen before the test seed below
# was evaluated. Optional validation calibration and blending remain configured
# for research runs but are disabled by default.

project:
  name: "UK_ETS_Forecasting"
  version: "0.4.0-qwen-evidence-refinement"

target:
  instrument: "UKA_FUTURES"
  column: "close_native"
  source: "uka_futures"
  currency: "GBP"
  price_column: "close"
  mode: "returns"

time_series:
  freq: "D"
  horizons: [1, 5, 20, 30]
  pred_len: 30
  seq_len: 20
  label_len: 10

split:
  train_end: "2024-06-30"
  val_end: "2025-06-30"
  test_end: "2026-03-04"

missing:
  max_ffill_days: 5
  min_coverage_pct: 0.80

features:
  include_brent: true
  include_coal: true
  include_uk_gas: true
  include_uk_power: true
  include_uk_weather: true
  weather_feature_pack_path: "weather-proxy/uk_weather_daily_feature_pack.csv"
  weather_lag_days: 1
  include_indices: false
  indices_list: []
  include_auctions: true
  auction_features: ["price", "is_auction_day"]
  auction_lags: [1, 5, 20]
  include_auction_proxy_pack: true
  auction_proxy_pack_path: "auction-proxy-features/uk_icap_primary_secondary_feature_pack.csv"
  auction_proxy_fill_limit: 10
  auction_proxy_days_since_cap: 30
  include_icap_secondary: false
  include_vstoxx: false
  returns: true
  rolling_vol_window: 20
  rolling_mean_windows: [5, 20, 60]
  max_exogenous_features_model: 16
  preferred_feature_order:
    - target_range_pct
    - target_volume
    - is_auction_day
    - uk_icap_primary_print_day
    - uk_icap_secondary_print_day
    - y_vol_20d
    - y_ma_5d
    - y_momentum_5d
    - y_momentum_20d
    - uk_power_return
    - uk_gas_return
    - brent_return
    - coal_return
    - uk_hdd18
    - uk_hdd18_7d_ma
    - uk_temp_mean_c

model:
  tsm_type: "dlinear"
  batch_size: 64
  learning_rate: 0.003
  max_epochs: 80
  early_stopping_patience: 12
  d_model: 32
  n_heads: 2
  e_layers: 1
  d_layers: 1
  d_ff: 64
  dropout: 0.3
  weight_decay: 0.01
  grad_clip: 0.5
  enc_in: 9
  dec_in: 9
  c_out: 1
  dlinear_individual: false
  kernel_size: 3
  dlinear_channel_mixer: "residual_linear"

llm:
  provider: "openai"
  model: "qwen3.6-27b-q4-k-m"
  # Ridge is the strongest full-split baseline under the corrected forecaster.
  base_model: "linear_ridge"
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 300
  client_max_retries: 1
  # Make the primary comparison deterministic. A thinking-enabled A/B can
  # override this explicitly without relying on the server default.
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  non_thinking_prompt_tag: "/no_think"
  methods: ["TSM+LLM-COT-RF-HDELTA"]
  history_points: 18
  include_summary_stats: true
  max_retries: 2
  cache_enabled: true
  max_samples: 16
  subset:
    strategy: random
    seed: 20261954
    val_strategy: spaced
    val_seed: 20260809
  max_exogenous_features: 6
  known_future_context:
    enabled: true
    # Only pre-announced binary schedule fields are permitted here. The runner
    # rejects continuous future panel values to guard against leakage.
    binary_feature_columns: ["is_auction_day"]
  cot_rf:
    k_examples: 6
    example_selection: regime_sign_balanced
    retrieval_max_reuse: 2
    retrieval_half_life_days: 120
    retrieval_sign_tolerance_pct: 0.10
    balanced_similarity_weight: 0.45
    balanced_regime_weight: 0.25
    balanced_recency_weight: 0.20
    balanced_correction_weight: 0.05
    balanced_reuse_weight: 0.05
    mmr_lambda: 0.80
    feature_window: 18
    lookback_days: 365
    augment_case_profiles_with_retrieval: true
    include_example_exogenous_summary: true
    example_exogenous_max_features: 6
    # The sign-balanced selector already seeds a near-zero/freeze analogue.
    # Appending the legacy counterexample here would bypass its reuse cap.
    include_counterexample_freeze: false
    counterexample_mode: low_error
    counterexample_quantile: 0.35
    retain_context: false
    strict_json_prompt: true
    strict_json_response_format: true
    structured_horizon_reflection: true
    reasoning_style: "chain_of_verification"
    apply_style: "continuous_evidence"
    allow_zero_actionable_horizons: true
    explicit_h30_independence: true
    include_hindsight_feedback: true
    enable_numeric_tool: true
    force_numeric_tool: true
    enable_delta_verifier_tool: true
    force_delta_verifier_tool: true
    max_tool_rounds: 4
    apply_skip_gate:
      enabled: true
      required_horizons: [20, 30]
      min_confidence: "medium"
      require_same_nonzero_preferred_sign: true
      minimum_actionable_evidence_horizons: 1
      evidence_target_min_abs_pct: 0.05
      require_evidence_sign_alignment: true
      # Medium-confidence residual analogues may refine a near-flat ridge path,
      # but cannot counteract a strong quantitative trend. High confidence is exempt.
      non_high_confidence_max_abs_base_slope_pct: 1.0
      base_slope_reference_horizon: 1
      base_slope_target_horizon: 30
  prompt_history_points: 18
  gating:
    enabled: false
    volatility_window: 20
    volatility_percentile: 0.6
  sentiment:
    enabled: false
  # Cross-development policy: Qwen's bounded positive correction is only
  # admitted when the quantitative base already has a non-negative H1→H30
  # slope. This gate uses no realized outcomes or LLM self-confidence.
  base_path_slope_gate:
    enabled: true
    reference_horizon: 1
    target_horizon: 30
    min_slope_pct: 0.0
  delta_calibration:
    enabled: false
    methods: ["TSM+LLM-COT-RF-HDELTA"]
    mode: "interpolated_joint"
    target_horizons: [1, 5, 20, 30]
    max_samples: 16
    min_scale: 0.0
    max_scale: 1.0
    ridge_strength: 0.05
    fixed_scales:
      h1: 0.0
    tune_scope: "recent_tail"
    recent_tail_fraction: 0.25
    recent_tail_min_samples: 48
  # Optional validation-selected comparator; not part of the frozen policy.
  blend_grid:
    enabled: false
    schedule: "uniform"
    weights: [0.0, 0.25, 0.5, 0.75, 1.0]
    key_horizons: [1, 5, 20, 30]
    max_samples: 16
    tune_split: "val"
    metric: "mse_path"
    tune_scope: "recent_tail"
    recent_tail_fraction: 0.25
    recent_tail_min_samples: 48

hdelta:
  key_horizons: [1, 5, 20, 30]
  case_conditioned: true
  max_adjustment_pct: 1.0
  freeze_horizons: [1]
  case_match_top_k: 4
  horizon_specific_matching: true
  horizon_match_top_k: 3
  horizon_match_union_limit: 6
  case_min_examples: 2
  case_min_sign_agreement: 0.66
  case_min_mean_abs_error_pct: 0.15
  case_bound_scale: 0.50
  continuous_evidence_sizing:
    enabled: true
    shrinkage: 0.35
    distance_temperature: 1.5
    dispersion_floor_pct: 0.10
    min_action_pct: 0.05
    agreement_power: 1.0
  structured_enforce_sign: true
  structured_cap_by_guidance: true
  structured_min_confidence_by_horizon:
    h20: medium
    h30: medium
  pre_refinement_base_slope_gate:
    enabled: true
    reference_horizon: 1
    target_horizon: 30
    min_slope_pct: 0.0
  case_min_bound_pct: 0.15
  # The former one-sided coherence rules suppressed negative corrections and
  # contributed to the observed positive-bias collapse. Evidence targets and
  # the structured verifier now handle sign conflicts symmetrically.
  structured_coherence_guards: false

evaluation:
  primary_metric: "mse"
  additional_metrics: ["mae", "rmse", "mape"]
  trend_threshold_method: "volatility"
  trend_threshold_multiplier: 0.25
  trend_classes: ["down", "flat", "up"]
  significance_level: 0.05
  tests: ["t_test", "wilcoxon"]

econometric:
  quantile_lasso:
    enabled: false
    quantiles: [0.1, 0.5, 0.9]
    alpha: 0.01
    lags: [1, 5, 10, 20]
  lasso_feature_selection:
    enabled: false
    alpha: 0.01
    alpha_by_horizon: {}
    max_iter: 10000
    min_features: 6
    max_features: 11
    coef_threshold: 1.0e-6
    feature_stats: ["last", "change_5", "change_20", "std_20"]
    target_horizons: [1, 5, 20, 30]
    target_aggregation: "mean"
    mode: "aggregate"
    target_weights: [0.1, 0.2, 0.3, 0.4]
    drop_weakest: 0

robustness:
  noise_levels: []
  subperiods: []

output:
  runs_dir: "runs"
  paper_dir: "paper"
  save_predictions: true
  save_model_checkpoints: true
  generate_plots: false
  generate_paper: false
  write_project_paper: false
  write_manuscript: false
  write_html_report: false
  write_pdf_report: false

reproducibility:
  seed: 42
  deterministic: true
  log_git_hash: true
  save_config: true

compute:
  device: "auto"
  num_workers: 0
  pin_memory: false
