# UK ETS Forecasting Configuration
# ================================

project:
  name: "UK_ETS_Forecasting"
  version: "0.1.0"

target:
  instrument: "UKA_FUTURES"
  column: "close_native"
  source: "uka_futures"
  currency: "GBP"
  price_column: "close"
  mode: "returns"

time_series:
  freq: "D"
  horizons: [1, 5, 20, 30]
  pred_len: 30
  seq_len: 120
  label_len: 30

split:
  train_end: "2024-06-30"
  val_end: "2025-06-30"
  test_end: "2026-03-04"

missing:
  max_ffill_days: 5
  min_coverage_pct: 0.80

features:
  include_brent: true
  include_coal: true
  include_uk_gas: true
  include_uk_power: true
  include_uk_weather: true
  weather_feature_pack_path: "weather-proxy/uk_weather_daily_feature_pack.csv"
  weather_lag_days: 1

  include_indices: false
  indices_list: []

  include_auctions: true
  auction_features: ["price", "is_auction_day"]
  auction_lags: [1, 5, 20]
  include_auction_proxy_pack: true
  auction_proxy_pack_path: "auction-proxy-features/uk_icap_primary_secondary_feature_pack.csv"
  auction_proxy_fill_limit: 10
  auction_proxy_days_since_cap: 30

  include_icap_secondary: false
  include_vstoxx: false

  returns: true
  rolling_vol_window: 20
  rolling_mean_windows: [5, 20, 60]
  max_exogenous_features_model: 18
  # UK defaults now include UK-local energy drivers plus benchmark fuel inputs.
  preferred_feature_order:
    - target_range_pct
    - target_volume
    - is_auction_day
    - uk_icap_primary_print_day
    - uk_icap_secondary_print_day
    - uk_icap_primary_days_since_print
    - uk_icap_secondary_days_since_print
    - y_vol_20d
    - y_ma_5d
    - y_momentum_5d
    - y_momentum_20d
    - uk_power_return
    - uk_gas_return
    - uk_power_gas_spread
    - brent_return
    - coal_return
    - uk_hdd18
    - uk_hdd18_7d_ma
    - uk_temp_mean_c

model:
  tsm_type: "autoformer"
  batch_size: 32
  learning_rate: 0.0001
  max_epochs: 100
  early_stopping_patience: 10
  d_model: 512
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 2048
  dropout: 0.05
  enc_in: 10
  dec_in: 10
  c_out: 1
  dlinear_channel_mixer: "residual_linear"

llm:
  provider: "openai"
  model: "gpt-5.2"
  temperature: 0.1
  max_tokens: 1000
  methods: ["DP", "CoT", "CoT-RF", "TSM+LLM"]
  history_points: 120
  include_summary_stats: true
  max_retries: 3
  cache_enabled: true
  max_samples: 500

evaluation:
  primary_metric: "mse"
  additional_metrics: ["mae", "rmse", "mape"]
  trend_threshold_method: "volatility"
  trend_threshold_multiplier: 0.25
  trend_classes: ["down", "flat", "up"]
  significance_level: 0.05
  tests: ["t_test", "wilcoxon"]

econometric:
  quantile_lasso:
    enabled: false
    quantiles: [0.1, 0.5, 0.9]
    alpha: 0.01
    lags: [1, 5, 10, 20]
  lasso_feature_selection:
    enabled: false
    alpha: 0.01
    alpha_by_horizon: {}
    max_iter: 10000
    min_features: 6
    max_features: 11
    coef_threshold: 1.0e-6
    feature_stats: ["last", "change_5", "change_20", "std_20"]
    target_horizons: [1, 5, 20, 30]
    target_aggregation: "mean"
    mode: "aggregate"
    target_weights: [0.1, 0.2, 0.3, 0.4]
    drop_weakest: 0

robustness:
  noise_levels: [0.05, 0.10, 0.20, 0.30]
  subperiods:
    - name: "post_uk_ets_launch"
      start: "2021-05-19"
      end: "2023-12-31"
    - name: "recent"
      start: "2024-01-01"
      end: "2026-03-04"

output:
  runs_dir: "runs"
  paper_dir: "paper"
  save_predictions: true
  save_model_checkpoints: true
  generate_plots: true
  generate_paper: true
  write_project_paper: false

reproducibility:
  seed: 42
  deterministic: true
  log_git_hash: true
  save_config: true

compute:
  device: "auto"
  num_workers: 4
  pin_memory: true
